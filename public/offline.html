<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Offline — Job Monitor</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                font-family:
                    system-ui,
                    -apple-system,
                    sans-serif;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                margin: 0;
                background: #f9fafb;
                color: #374151;
            }
            .box {
                text-align: center;
                padding: 2rem;
                max-width: 420px;
            }
            .icon {
                font-size: 3rem;
                margin-bottom: 1rem;
            }
            h1 {
                font-size: 1.35rem;
                margin: 0 0 0.5rem;
            }
            p {
                color: #6b7280;
                font-size: 0.9rem;
                line-height: 1.5;
                margin: 0 0 1.5rem;
            }
            button {
                background: #4f46e5;
                color: #fff;
                border: 0;
                padding: 0.6rem 1.4rem;
                border-radius: 0.5rem;
                font-weight: 600;
                font-size: 0.875rem;
                cursor: pointer;
            }
            button:hover {
                background: #4338ca;
            }
        </style>
    </head>
    <body>
        <div class="box">
            <div class="icon">📡</div>
            <h1>Anda sedang offline</h1>
            <p>Periksa koneksi internet Anda, lalu muat ulang halaman ini.</p>
            <button onclick="location.reload()">Muat Ulang</button>
        </div>
    </body>
</html>
